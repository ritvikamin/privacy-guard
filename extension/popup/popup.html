<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacy Guard</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <div class="brand">
        <div class="icon-bg" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
        <div>
          <h1>Privacy Guard</h1>
          <p class="subtitle">Redacts PII before it leaves your browser</p>
        </div>
      </div>
      <label class="switch" title="Turn protection on or off">
        <input type="checkbox" id="powerToggle" checked aria-label="Protection enabled">
        <span class="slider"></span>
      </label>
    </header>

    <section id="statusBar" class="status" role="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <div>
        <strong id="statusLabel">Checking…</strong>
        <p id="statusHint"></p>
      </div>
    </section>

    <section class="stats-grid" aria-label="Statistics">
      <div class="stat-card"><h2 id="entityCount">0</h2><p>Redacted</p></div>
      <div class="stat-card"><h2 id="typeCount">0</h2><p>Types seen</p></div>
      <div class="stat-card"><h2 id="supportedCount">11</h2><p>Supported</p></div>
    </section>

    <section>
      <h3>Breakdown by type</h3>
      <div id="breakdown-list" class="empty-state">No PII detected yet</div>
    </section>

    <section>
      <h3>Vault <span class="muted">(stays on this device)</span></h3>
      <ul id="vaultList" class="vault-list"></ul>
    </section>

    <section class="actions">
      <div class="toggle-row">
        <button id="revealBtn" class="btn secondary" title="Show the real values on this page">Reveal on page</button>
        <button id="hideBtn" class="btn secondary" title="Put the tags back on this page">Hide on page</button>
      </div>
      <button id="clearBtn" class="btn danger">Clear vault</button>
      <div id="confirmRow" class="toggle-row" hidden>
        <button id="confirmYes" class="btn danger">Yes, clear</button>
        <button id="confirmNo" class="btn secondary">Cancel</button>
      </div>
      <p id="toast" class="toast" role="status" aria-live="polite"></p>
    </section>

    <footer class="footer">
      <span>Monitoring ChatGPT · Gemini</span>
      <span class="badge">Regex + BERT</span>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
